services:
  kaspad:
    image: supertypo/rusty-kaspad:latest
    container_name: kaspad
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR:-./data}/data:/data
    ports:
      - 16110:16110  # GRPC
      - 16111:16111  # P2P
      - 17110:17110  # WRPC (Borsh)
      - 18110:18110  # WRPC (JSON)
    command: >
      kaspad
      --rpclisten=0.0.0.0:16110
      --rpclisten-borsh=0.0.0.0:17110
      --rpclisten-json=0.0.0.0:18110
      --loglevel=info
    networks:
      - kaspa-net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: kaspa-dashboard
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 4321
      STATIC_DIR: /app/static
      KASPAD_WRPC_URL: ws://kaspad:17110
    depends_on:
      - kaspad
    ports:
      - 4321:4321
    networks:
      - kaspa-net

networks:
  kaspa-net:
    driver: bridge
